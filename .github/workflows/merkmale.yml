name: Merkmale aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merkmale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: merkmale.md aus dem Phrasenmäher-Repo holen
        run: curl -fsSL https://raw.githubusercontent.com/marco-koerner/phrasenmaeher/main/merkmale.md -o /tmp/merkmale.md
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/merkmale.py /tmp/merkmale.md
      - name: Änderung speichern
        run: |
          if [ -n "$(git status --porcelain phrasenmaeher/merkmale.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add phrasenmaeher/merkmale.js
            git commit -m "Merkmale aus marco-koerner/phrasenmaeher aktualisieren"
            git push
          fi
